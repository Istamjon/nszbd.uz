# ── HTTP → HTTPS redirect for both domains ─────────────────
server {
    listen 80;
    server_name nszbd.uz www.nszbd.uz admin.nszbd.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/html/public;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Frontend: nszbd.uz ─────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name nszbd.uz www.nszbd.uz;

    ssl_certificate     /etc/letsencrypt/live/nszbd.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nszbd.uz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options       "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header X-XSS-Protection      "1; mode=block" always;
    add_header Referrer-Policy       "strict-origin-when-cross-origin" always;

    # Proxy to Next.js container
    location / {
        proxy_pass         http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Next.js static files with long-term caching
    location /_next/static/ {
        proxy_pass http://frontend:3000/_next/static/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
}

# ── Admin CMS: admin.nszbd.uz ──────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name admin.nszbd.uz;

    ssl_certificate     /etc/letsencrypt/live/nszbd.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nszbd.uz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Frame-Options       "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"     always;

    client_max_body_size 50M;

    root /var/www/html/public;
    index index.php;

    # Uploads & Storage served directly from mounted storage
    location /uploads/ {
        alias /var/www/html/storage/app/public/;
        expires 30d;
        add_header Cache-Control "public";
    }


    # Storage public files (uploaded images, PDFs)
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        expires 30d;
        add_header Cache-Control "public";
    }


    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM
    location ~ \.php$ {
        fastcgi_pass   elmapi:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param  DOCUMENT_ROOT /var/www/html/public;
        include        fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
    }

    location ~ /\.ht {
        deny all;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
}

