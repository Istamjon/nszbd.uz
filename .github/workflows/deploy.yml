name: Deploy to Production (nszbd.uz)

on:
  push:
    branches:
      - main
  workflow_dispatch:   # Manual trigger

jobs:
  deploy:
    name: SSH Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout ──────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Deploy via SSH ────────────────────────────────
      - name: Deploy to VDS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script: |
            set -e

            echo "──────────────────────────────────────"
            echo "  Deploying nszbd.uz  — $(date)"
            echo "──────────────────────────────────────"

            # ── Go to project directory ─────────────────
            cd /home/${{ secrets.SERVER_USER }}/nszbd.uz

            # ── Pull latest code ────────────────────────
            git fetch origin main
            git reset --hard origin/main

            # ── Rebuild & restart containers ────────────
            docker compose pull --quiet || true
            docker compose build --no-cache
            docker compose up -d --remove-orphans

            # ── Wait for services to become healthy ─────
            echo "Waiting for services..."
            sleep 15

            # ── Run Laravel post-deploy commands ────────
            docker compose exec -T elmapi php artisan migrate --force
            docker compose exec -T elmapi php artisan config:cache
            docker compose exec -T elmapi php artisan route:cache
            docker compose exec -T elmapi php artisan view:cache

            # ── Cleanup old Docker images ────────────────
            docker image prune -f

            echo "✅ Deployment complete!"

      # ── 3. Notify on failure ─────────────────────────────
      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Deployment FAILED. Check GitHub Actions logs."
